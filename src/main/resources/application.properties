spring.application.name=passa-aqui-backend

# Importa segredos e chaves locais se o arquivo existir (ignorado pelo git)
spring.config.import=optional:classpath:application-secrets.properties

jwt.secret=${JWT_SECRET:${jwt.secret:}}

# Banco de Dados

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection Pool Hikari (Otimizado para 1000 usuarios simultaneos)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=15000

# Tomcat Server Threads
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=500

# XP Calculation

xp.take-rate=${XP_TAKE_RATE:0.05}
xp.margin-factor=${XP_MARGIN_FACTOR:0.60}
xp.absolute-ceiling=${XP_ABSOLUTE_CEILING:15.00}
xp.conversion-factor=${XP_CONVERSION_FACTOR:100}

# MinIO

minio.url=${MINIO_URL:http://localhost:9000}
minio.url.external=${MINIO_URL_EXTERNAL:http://localhost:9000}
minio.access.key=${MINIO_ACCESS_KEY:${minio.access.key:root}}
minio.secret.key=${MINIO_SECRET_KEY:${minio.secret.key:root@123}}
minio.bucket.name=${MINIO_BUCKET_NAME:${minio.bucket.name:passaaqui-bucket}}

# AbacatePay

abacatepay.api.key=${ABACATEPAY_API_KEY:${abacatepay.api.key:}}
abacatepay.webhook.secret=${ABACATEPAY_WEBHOOK_SECRET:${abacatepay.webhook.secret:}}

# OpenRouteService

openrouteservice.api.key=${OPENROUTESERVICE_API_KEY:${openrouteservice.api.key:}}

# Redis

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
spring.data.redis.client-type=jedis

logging.level.com.passaaqui=INFO