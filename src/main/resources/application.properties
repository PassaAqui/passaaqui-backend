spring.application.name=passa-aqui-backend

jwt.secret=${JWT_SECRET}

# Banco de Dados

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# XP Calculation

xp.take-rate=${XP_TAKE_RATE:0.05}
xp.margin-factor=${XP_MARGIN_FACTOR:0.60}
xp.absolute-ceiling=${XP_ABSOLUTE_CEILING:15.00}
xp.conversion-factor=${XP_CONVERSION_FACTOR:100}

# MinIO

minio.url=${MINIO_URL}
minio.url.external=${MINIO_URL_EXTERNAL}
minio.access.key=${MINIO_ACCESS_KEY}
minio.secret.key=${MINIO_SECRET_KEY}
minio.bucket.name=${MINIO_BUCKET_NAME}

# AbacatePay

abacatepay.api.key=${ABACATEPAY_API_KEY}
abacatepay.webhook.secret=${ABACATEPAY_WEBHOOK_SECRET}

# OpenRouteService

openrouteservice.api.key=${OPENROUTESERVICE_API_KEY}